    <text transform="translate(188.62 398.62)"><tspan class="cls-7"><tspan x="0" y="0">나만 예민한가?</tspan></tspan><tspan class="cls-6"><tspan x="0" y="78">이 질문을 끝없이 고민하다 결국 답을 내리지 못했습니다.</tspan></tspan><tspan class="cls-6"><tspan x="0" y="117">사람마다 예민함의 척도가 다르기에 각자의 생각을 평생 이해할 수 없고 </tspan></tspan><tspan class="cls-6"><tspan x="0" y="156">서로를 이해할 수 없기에 생기는 간극과 상처에 대해 자그마한 해결책을 제시하고자 했습니다.</tspan></tspan><tspan class="cls-6"><tspan x="0" y="234">처음 HSP의 존재를 알게 되었을 땐 요즘 유행하는 명명하기(예를 들면 고지능 우울증 테스트, 본래의 뜻과 다르게 쓰이는 adhd... 등등)처럼 </tspan></tspan><tspan class="cls-9"><tspan class="cls-8" x="0" y="273">내 행동을 정당화하기 위한 합리화에 불과하다고 생각했습니다. </tspan><tspan class="cls-5" x="825.91" y="273">자신을 틀 안에 가타놓고 합리화하는 사람이 많기에</tspan></tspan><tspan class="cls-6"><tspan x="0" y="351">그저 본인의 결함이나 특정 행동을 설명할 수 있도록 그럴싸하게 포장한 것으로 보였습니다. 하지만 겉으로는 정상인과 다름없이 살아가는 척하며, 덤덤한 하루를 </tspan></tspan><tspan class="cls-6"><tspan x="0" y="390">보내는 데 자신의 모든 에너지를 소비하는 사람들이 나 말고도 더 있을 것이라는 믿음 속에서 무작정 특징들을 분석해본 결과 </tspan></tspan><tspan class="cls-6"><tspan x="0" y="429">&apos;아. 나는 좀 더 예민한 축에 속하는구나.’ 하고 알 수 있었던 거죠.</tspan></tspan><tspan class="cls-6"><tspan x="0" y="507">단순히 상상력이 풍부해서, 느낄 수 있는 감각이 풍부해서가 아닌 </tspan></tspan><tspan class="cls-6"><tspan x="0" y="546">내가 원하지 않는 감각들까지 억지로 수용한 채로 그걸 밖으로 흘려보낼 수 없는 상태를 느껴보신 적 있나요?</tspan></tspan></text>
